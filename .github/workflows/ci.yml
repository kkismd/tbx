name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main, issue/470-sttr1-porting, integration/**]

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -Dwarnings

jobs:
    first-check:
        name: TBX 1st / Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo check -p tbx-1st --all-targets

    first-test:
        name: TBX 1st / Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo test -p tbx-1st

    next-check:
        name: Next / Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo check -p tbx-next --all-targets

    next-test:
        name: Next / Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo test -p tbx-next

    next-6502-smoke:
        name: Next / 6502 Smoke
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
            - run: sudo apt-get update && sudo apt-get install --yes cc65
            - run: cargo test -p tbx-next --test sim65_smoke
            - run: cargo test -p tbx-next --test sim65_smoke -- --ignored
            - run: cargo test -p tbx-next --test sim65_vm -- --ignored
            - run: cargo test -p tbx-next --lib wrapper_text_bytes_assemble_with_special_and_utf8_bytes -- --ignored
            - run: cargo test -p tbx-next --lib prime_source_matches_sim65_execution -- --ignored
            - run: cargo test -p tbx-next --lib mandelbrot_source_matches_sim65_execution -- --ignored
            - run: cargo test -p tbx-next --lib minimal_array_source_matches_sim65_execution -- --ignored
            - run: cargo test -p tbx-next --lib minimal_fixed_text_source_matches_sim65_execution -- --ignored
            - run: cargo test -p tbx-next --lib squares_source_matches_sim65_execution -- --ignored
            - run: cargo test -p tbx-next --lib grades_source_matches_sim65_execution -- --ignored
            - run: cargo test -p tbx-next --lib eightqueen_source_matches_sim65_execution -- --ignored
            - run: cargo test -p tbx-next --lib maze_source_matches_sim65_execution -- --ignored
            - run: cargo test -p tbx-next --lib scripted_try_input_source_matches_host_execution -- --ignored
            - run: cargo test -p tbx-next --lib strict_scripted_try_input_fails_after_stdout_prefix -- --ignored

    clippy:
        name: Workspace / Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - run: cargo clippy --workspace --all-targets

    fmt:
        name: Workspace / Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt
            - run: cargo fmt --all --check
